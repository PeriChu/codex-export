[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-export"
version = "0.1.5"
description = "Export local Codex sessions to HTML, Markdown, JSON, and CSV bundles."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["codex", "openai", "export", "transcript", "jsonl", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/PeriChu/codex-export"
Repository = "https://github.com/PeriChu/codex-export"
Issues = "https://github.com/PeriChu/codex-export/issues"

[project.scripts]
codex-export = "codex_export:main"
codex-session-export = "codex_export:main"

[tool.setuptools]
py-modules = ["codex_export"]
